<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telnet Config Saver</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Telnet Config Saver</h1>
        </div>

        <div class="form-card">
            <h2>Device Configuration</h2>
            <form id="deviceForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="deviceType">Device Type</label>
                        <select id="deviceType" name="device_type" required>
                            <option value="cisco_ios_telnet">Cisco IOS (Telnet)</option>
                            <option value="cisco_xr_telnet">Cisco XR (Telnet)</option>
                            <option value="juniper_telnet">Juniper (Telnet)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="host">Host/IP Address</label>
                        <input type="text" id="host" name="host" placeholder="e.g., 172.19.20.218" value="172.19.20.218" required>
                    </div>
                    <div class="form-group">
                        <label for="port">Port</label>
                        <input type="number" id="port" name="port" placeholder="e.g., 23" value="30001" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="e.g., cisco">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="e.g., cisco">
                    </div>
                    <div class="form-group">
                        <label for="secret">Secret</label>
                        <input type="password" id="secret" name="secret" placeholder="Enable secret (if required)">
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Fetch Configuration</button>
                    <button type="reset" class="btn-clear">Clear Form</button>
                </div>
            </form>
        </div>

        <div id="results" class="results">
            <div class="form-card">
                <h2>Interface Configurations</h2>
                <div id="interfaceFilters">
                    <label for="hideNoServicePolicy">Hide No Service-Policy Interfaces:</label>
                    <input type="checkbox" id="hideNoServicePolicy" name="hideNoServicePolicy" checked>
                </div>
                <small id="interfaceFilterStatus">Result</small>
                <div id="interfaceContainer" class="interface-grid"></div>
            </div>

            <div class="form-card raw-response">
                <h3>Raw Response</h3>
                <pre id="rawResponse"></pre>
            </div>
        </div>
    </div>
    <div id="status" class="status">Status</div>
</body>
</html>
